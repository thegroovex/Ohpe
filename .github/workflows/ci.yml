name: CI

# Every push to main, every pull request and every manual run (Actions -> CI -> Run workflow):
# Linux, macOS universal and Windows are built and tested - so a pull request is checked on all
# three platforms before it is merged. Each platform is built once; the tests then run as parallel
# jobs on the build artefacts:
#   Linux    core tests (own JUCE-free build, starts at once), plug-in tests + VST3 host test,
#            pluginval (strictness 5), documentation screenshots (not on pushes to main)
#   macOS    all tests, auval -strict, plus the pkg/DMG installer (installed and tested on the runner)
#   Windows  all tests
# The doctest binaries run one test case per process on all cores (scripts/ci/run-tests.py), and
# the test jobs are split over several runners (matrix "shard": every process runs on exactly one).
# Compiler output is cached with ccache, the downloaded dependencies (JUCE, Link, doctest, JSON,
# juceaide) and pluginval with actions/cache.
#
# The macOS installer is built on main, on manual runs, for releases, and on pull requests that
# carry the label "installer" (the label takes effect with the next push, or run the workflow
# manually on the branch). Pull requests that only change docs/** or *.md skip the builds; the
# "CI result" job reports for every run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# A new push to a pull request cancels its running CI; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "true"
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 2G
  OHPE_DEPS_DIR: ${{ github.workspace }}/.deps
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  # ---------------------------------------------------------------------------------- what to run
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.result.outputs.code }}
      installer: ${{ steps.result.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
      - id: result
        env:
          EVENT: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'installer') }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            [ "$FILTER_CODE" = true ] || code=false
          fi
          installer=false
          case "$EVENT" in
            push|workflow_dispatch|release) installer=true ;;
            pull_request) [ "$HAS_LABEL" = true ] && installer=true ;;
          esac
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "code changes: $code, macOS installer: $installer"

  docs-only:
    name: Docs only (builds skipped)
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Only docs/** or *.md changed - builds and tests are skipped."

  # ---------------------------------------------------------------------------------- Linux
  linux-core:
    name: Linux core tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-gcc-core-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'tests/**/CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-gcc-core-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'tests/**/CMakeLists.txt') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-gcc-core-

      - name: Test timings (schedules long test cases first)
        uses: actions/cache@v4
        with:
          path: .ci-timings
          key: timings-linux-core-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: timings-linux-core-${{ matrix.shard }}-

      - name: Pack tools smoke test (make_ohpepack build/check, make_manifest)
        if: matrix.shard == 0
        run: bash scripts/ci/pack-tools-smoke.sh

      # p62: the 1.0 format freeze - version constants, golden fixtures and the format documents never change silently
      # (against the pull request's base / the previous main commit: versions only go up, fixtures are never changed)
      - name: Format freeze check (versions, golden fixtures, docs)
        if: matrix.shard == 0
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            python3 scripts/ci/check-formats.py --base "$BASE"
          else
            python3 scripts/ci/check-formats.py
          fi

      - name: Configure + build (core, no JUCE)
        run: |
          ccache -z
          cmake -S . -B build-core -G Ninja -DCMAKE_BUILD_TYPE=Release -DOHPE_BUILD_PLUGIN=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-core --config Release
          ccache -s

      - name: Core tests
        run: |
          mkdir -p .ci-timings
          python3 scripts/ci/run-tests.py --build-dir build-core --split core_tests -j "$(nproc)" \
            --shard ${{ matrix.shard }}/2 --timings .ci-timings/linux-core.json

      # p35: CPU benchmark - printed (log + job summary) for information only. Nothing gates on timing; the step fails
      # only when a scenario renders a non-finite or runaway output.
      - name: Benchmark (informational, percent of one core)
        if: matrix.shard == 0
        run: |
          build-core/tests/core/ohpe_bench --quick | tee bench.txt
          { echo '### ohpe_bench (CI runner, informational)'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  linux-build:
    name: Linux build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-gcc-full-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'tests/**/CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-gcc-full-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'tests/**/CMakeLists.txt') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-gcc-full-

      - name: Dependency cache (JUCE, Link, doctest, JSON, juceaide)
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-ninja-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-ninja-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DFETCHCONTENT_BASE_DIR=$OHPE_DEPS_DIR" -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: |
          ccache -z
          cmake --build build --config Release
          ccache -s

      - name: Pack build tree
        run: scripts/ci/pack-build.sh build build-linux.tar

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build-linux.tar
          retention-days: 3
          compression-level: 1

  linux-plugin-tests:
    name: Linux plug-in tests (${{ matrix.shard }}/2)
    needs: linux-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libfreetype6 libfontconfig1 libx11-6 libxrandr2 \
            libxinerama1 libxcursor1 libxext6 libgl1 xvfb xauth fonts-dejavu-core

      - uses: actions/download-artifact@v4
        with:
          name: build-linux

      - name: Unpack build tree
        run: tar -xf build-linux.tar && rm build-linux.tar

      - name: Test timings (schedules long test cases first)
        uses: actions/cache@v4
        with:
          path: .ci-timings
          key: timings-linux-plugin-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: timings-linux-plugin-${{ matrix.shard }}-

      # core_tests: the "Linux core tests" job runs them (same sources and flags, JUCE-free build)
      - name: Plug-in tests
        run: |
          mkdir -p .ci-timings
          xvfb-run -a python3 scripts/ci/run-tests.py --build-dir build --split plugin_tests \
            -E '^core_tests$' -j "$(nproc)" --shard ${{ matrix.shard }}/2 --timings .ci-timings/linux-plugin.json

  linux-pluginval:
    name: Linux pluginval
    needs: linux-build
    runs-on: ubuntu-24.04
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libfreetype6 libfontconfig1 libx11-6 libxrandr2 \
            libxinerama1 libxcursor1 libxext6 libgl1 xvfb xauth fonts-dejavu-core

      - name: Latest pluginval release
        id: pv
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo Tracktion/pluginval --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"

      - name: pluginval cache
        id: pvcache
        uses: actions/cache@v4
        with:
          path: pluginval-bin
          key: pluginval-${{ runner.os }}-${{ steps.pv.outputs.tag }}

      - name: Get pluginval
        if: steps.pvcache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.pv.outputs.tag }}" --repo Tracktion/pluginval -p pluginval_Linux.zip
          unzip -q pluginval_Linux.zip -d pluginval-bin
          chmod +x pluginval-bin/pluginval

      - uses: actions/download-artifact@v4
        with:
          name: build-linux

      - name: Unpack build tree
        run: tar -xf build-linux.tar && rm build-linux.tar

      - name: pluginval (strictness 5)
        run: |
          xvfb-run -a pluginval-bin/pluginval --strictness-level 5 --validate-in-process \
            --timeout-ms 600000 --output-dir build/pluginval \
            --validate build/Ohpe_artefacts/Release/VST3/Ohpe.vst3

      - name: Upload pluginval log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log-linux
          path: build/pluginval
          if-no-files-found: ignore

  linux-screenshots:
    name: Linux documentation screenshots
    needs: linux-build
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libfreetype6 libfontconfig1 libx11-6 libxrandr2 \
            libxinerama1 libxcursor1 libxext6 libgl1 xvfb xauth fonts-dejavu-core

      - uses: actions/download-artifact@v4
        with:
          name: build-linux

      - name: Unpack build tree
        run: tar -xf build-linux.tar && rm build-linux.tar

      - name: Render the documentation screenshots
        run: xvfb-run -a build/ohpe_screenshot_artefacts/Release/ohpe_screenshot screenshots

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ohpe-screenshots
          path: screenshots
          if-no-files-found: error

  # ---------------------------------------------------------------------------------- macOS
  macos-build:
    name: macOS universal build (app, AU, VST3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ninja ccache

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-appleclang-universal-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'tests/**/CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-appleclang-universal-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'tests/**/CMakeLists.txt') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-appleclang-universal-

      - name: Dependency cache (JUCE, Link, doctest, JSON, juceaide)
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-ninja-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-ninja-

      - name: Configure (arm64 + x86_64)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DFETCHCONTENT_BASE_DIR=$OHPE_DEPS_DIR" -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: |
          ccache -z
          cmake --build build --config Release
          ccache -s

      - name: Check universal binaries
        run: |
          for f in build/Ohpe_artefacts/Release/Standalone/Ohpe.app/Contents/MacOS/Ohpe \
                   build/Ohpe_artefacts/Release/VST3/Ohpe.vst3/Contents/MacOS/Ohpe \
                   build/Ohpe_artefacts/Release/AU/Ohpe.component/Contents/MacOS/Ohpe; do
            lipo -info "$f"
            lipo "$f" -verify_arch arm64 x86_64
          done

      - name: Check the app icon in the bundles
        run: |
          for b in build/Ohpe_artefacts/Release/Standalone/Ohpe.app build/Ohpe_artefacts/Release/VST3/Ohpe.vst3 \
                   build/Ohpe_artefacts/Release/AU/Ohpe.component; do
            cmp "$b/Contents/Resources/AppIcon.icns" resources/icon/Ohpe.icns
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$b/Contents/Info.plist")" = AppIcon.icns
            echo "ok   $b: AppIcon.icns = resources/icon/Ohpe.icns"
          done

      - name: Package
        run: |
          mkdir -p dist
          cd build/Ohpe_artefacts/Release
          ditto -c -k --keepParent Standalone/Ohpe.app "$GITHUB_WORKSPACE/dist/Ohpe-macOS-app.zip"
          ditto -c -k --keepParent VST3/Ohpe.vst3 "$GITHUB_WORKSPACE/dist/Ohpe-macOS-VST3.zip"
          ditto -c -k --keepParent AU/Ohpe.component "$GITHUB_WORKSPACE/dist/Ohpe-macOS-AU.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Ohpe-macOS-universal (unsigned)
          path: dist/*.zip

      - name: Pack build tree
        run: scripts/ci/pack-build.sh build build-macos.tar

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: build-macos.tar
          retention-days: 3
          compression-level: 1

  macos-tests:
    name: macOS tests (${{ matrix.shard }}/2)
    needs: macos-build
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-macos

      - name: Unpack build tree
        run: tar -xf build-macos.tar && rm build-macos.tar

      - name: Test timings (schedules long test cases first)
        uses: actions/cache@v4
        with:
          path: .ci-timings
          key: timings-macos-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: timings-macos-${{ matrix.shard }}-

      - name: Tests
        run: |
          mkdir -p .ci-timings
          python3 scripts/ci/run-tests.py --build-dir build --split core_tests,plugin_tests \
            -j "$(sysctl -n hw.ncpu)" --shard ${{ matrix.shard }}/2 --timings .ci-timings/macos.json

  macos-auval:
    name: macOS auval (strict)
    needs: macos-build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-macos

      - name: Unpack build tree
        run: tar -xf build-macos.tar && rm build-macos.tar

      - name: Validate the Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Ohpe_artefacts/Release/AU/Ohpe.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a | grep -i ohpe || true
          auval -strict -v aumu Ohpe Grvx

  macos-installer:
    name: macOS installer (pkg + DMG)
    needs: [changes, macos-build]
    if: needs.changes.outputs.installer == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-macos

      - name: Unpack build tree
        run: tar -xf build-macos.tar && rm build-macos.tar

      # Signing and notarisation are optional: they run only when the repository secrets below
      # are set (docs/en/INSTALL.md, "Signing and notarisation"); otherwise the pkg is unsigned
      # and its postinstall script ad-hoc signs the installed bundles.
      - name: Import signing certificates (optional)
        env:
          MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATES_P12" ]; then
            echo "No MACOS_CERTIFICATES_P12 secret - building an unsigned installer."
            exit 0
          fi
          KC="$RUNNER_TEMP/ohpe-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/certs.p12" -k "$KC" -P "$MACOS_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certs.p12"
          security find-identity -v "$KC"
          echo "OHPE_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build installer (pkg + DMG)
        env:
          OHPE_SIGN_APP_IDENTITY: ${{ secrets.MACOS_SIGN_APP_IDENTITY }}
          OHPE_SIGN_INSTALLER_IDENTITY: ${{ secrets.MACOS_SIGN_INSTALLER_IDENTITY }}
          OHPE_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          OHPE_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          OHPE_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: packaging/macos/build-installer.sh --out dist-installer

      - name: Validate installer (install, files, auval, Gatekeeper fix, uninstall)
        run: packaging/macos/validate-installer.sh dist-installer

      - uses: actions/upload-artifact@v4
        with:
          name: Ohpe-macOS-Installer
          path: |
            dist-installer/*.dmg
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${OHPE_KEYCHAIN:-}" ]; then security delete-keychain "$OHPE_KEYCHAIN" || true; fi

  # ---------------------------------------------------------------------------------- Windows
  windows-build:
    name: Windows build (app, VST3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja + ccache
        shell: pwsh
        run: |
          $ccv = "4.10.2"
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$ccv/ccache-$ccv-windows-x86_64.zip" -OutFile "$env:RUNNER_TEMP\ccache.zip"
          Expand-Archive "$env:RUNNER_TEMP\ccache.zip" -DestinationPath "$env:RUNNER_TEMP\ccache"
          Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile "$env:RUNNER_TEMP\ninja.zip"
          Expand-Archive "$env:RUNNER_TEMP\ninja.zip" -DestinationPath "$env:RUNNER_TEMP\ninja"
          "$env:RUNNER_TEMP\ccache\ccache-$ccv-windows-x86_64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:RUNNER_TEMP\ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-msvc-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'tests/**/CMakeLists.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-msvc-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'tests/**/CMakeLists.txt') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-msvc-

      - name: Dependency cache (JUCE, Link, doctest, JSON, juceaide)
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-ninja-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-ninja-

      - name: Configure
        shell: bash
        run: |
          which ninja ccache cl cmake
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "-DFETCHCONTENT_BASE_DIR=$OHPE_DEPS_DIR" -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        shell: bash
        run: |
          ccache -z
          cmake --build build --config Release
          ccache -s

      - name: Check the app icon in the exe and the VST3
        shell: bash
        run: |
          python tools/app-icon/check_pe_icon.py resources/icon/Ohpe.ico \
            build/Ohpe_artefacts/Release/Standalone/Ohpe.exe \
            build/Ohpe_artefacts/Release/VST3/Ohpe.vst3/Contents/x86_64-win/Ohpe.vst3

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Ohpe_artefacts/Release/Standalone/Ohpe.exe -DestinationPath dist/Ohpe-Windows-app.zip
          Compress-Archive -Path build/Ohpe_artefacts/Release/VST3/Ohpe.vst3 -DestinationPath dist/Ohpe-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ohpe-Windows-x64 (unsigned)
          path: dist/*.zip

      - name: Pack build tree
        shell: bash
        run: scripts/ci/pack-build.sh build build-windows.tar

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build-windows.tar
          retention-days: 3
          compression-level: 1

  windows-tests:
    name: Windows tests (${{ matrix.shard }}/3)
    needs: windows-build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-windows

      - name: Unpack build tree
        shell: bash
        run: tar -xf build-windows.tar && rm build-windows.tar

      - name: Test timings (schedules long test cases first)
        uses: actions/cache@v4
        with:
          path: .ci-timings
          key: timings-windows-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: timings-windows-${{ matrix.shard }}-

      - name: Tests
        shell: bash
        run: |
          mkdir -p .ci-timings
          python scripts/ci/run-tests.py --build-dir build --split core_tests,plugin_tests \
            -j "$NUMBER_OF_PROCESSORS" --shard ${{ matrix.shard }}/3 --timings .ci-timings/windows.json

  # ---------------------------------------------------------------------------------- result
  result:
    name: CI result
    if: always()
    needs: [changes, docs-only, linux-core, linux-build, linux-plugin-tests, linux-pluginval, linux-screenshots,
            macos-build, macos-tests, macos-auval, macos-installer, windows-build, windows-tests]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = json.load(sys.stdin)
          code = os.environ["CODE"] == "true"
          bad = []
          for name, n in needs.items():
              r = n["result"]
              print(f"{name:20} {r}")
              if r in ("failure", "cancelled"):
                  bad.append(name)
              # with code changes every build / test job must have run
              if code and r == "skipped" and name not in ("docs-only", "macos-installer", "linux-screenshots"):
                  bad.append(name)
          if needs["changes"]["result"] != "success":
              bad.append("changes")
          sys.exit(f"failed: {bad}" if bad else 0)'
