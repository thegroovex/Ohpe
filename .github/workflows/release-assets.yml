name: release-assets

# Attaches the build artefacts of a finished CI run to an existing GitHub release.
# p27: also writes the update manifest (ohpe-update.json: assets with sizes and SHA-256, the EN / DE notes from the
# release text, content packs from packaging/content) that the in-app updater reads, and SHA256SUMS.txt.
# 0.9.0: also attaches the macOS app / VST3 / AU zips and the PDF manual (Ohpe-Manual-EN.pdf, Ohpe-Manual-DE.pdf,
# built by tools/manual/build_manual.py in the CI run's job "Manual (PDF)" from the same commit, so the cover shows
# the release version). The updater manifest never lists the zips of macOS or the manuals (only installers / Windows
# archives), and SHA256SUMS.txt covers every attached file.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      run_id:
        description: "CI run id whose artefacts are attached"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/update
            tools/pack
            packaging
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # only the release artefacts (Ohpe-macOS-Installer, Ohpe-Windows-x64 (unsigned), ...);
          # CI's internal build-<os> trees and screenshots are not needed
          pattern: Ohpe-*
          path: art
      - name: Collect files
        run: |
          set -e
          mkdir out
          ver="${{ inputs.tag }}"; ver="${ver#v}"
          find art -type f -name '*Installer*.dmg' -exec cp {} out/ \;
          find art -type f \( -name 'Ohpe-Windows-*.zip' -o -name 'Ohpe-macOS-*.zip' \) -print0 | while IFS= read -r -d '' f; do
            b=$(basename "$f"); cp "$f" "out/Ohpe-$ver-${b#Ohpe-}"
          done
          # the PDF manual EN + DE (artifact Ohpe-Manual); a release without both manuals fails here
          for l in EN DE; do
            m=$(find art -type f -name "Ohpe-Manual-$l.pdf" | head -n 1)
            test -n "$m" || { echo "missing Ohpe-Manual-$l.pdf in run ${{ inputs.run_id }}"; exit 1; }
            cp "$m" out/
          done
          find art -type f | sed 's/^/  /'
      - name: Update manifest and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" --json body,isPrerelease > release.json
          python3 -c "import json; d = json.load(open('release.json')); open('body.md', 'w', encoding='utf-8').write(d.get('body') or '')"
          pre=$(python3 -c "import json; print('--prerelease' if json.load(open('release.json')).get('isPrerelease') else '')")
          python3 tools/update/make_manifest.py --tag "${{ inputs.tag }}" --repo "${{ github.repository }}" --dir out \
            --body-file body.md --content-dir packaging/content $pre
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" out/* --clobber --repo "${{ github.repository }}"
