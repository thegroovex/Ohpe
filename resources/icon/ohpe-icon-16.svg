<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ohpe app icon - 16 px master (16 grid). Own artwork (designed by groovex).
  The mark at its smallest: full tile, 1.3 px ring, 1.2 px sine (still two periods), a wide gap
  with a 2.4 px PLAY dot, no glow. Rebuild: python3 tools/app-icon/make_icons.py
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36322f"/>
      <stop offset="1" stop-color="#1b1918"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="url(#tile)"/>
  <g fill="none" stroke="#f2ede3" stroke-linecap="round" stroke-linejoin="round">
    <!-- ring r = 5.7 around (8, 8.2), gap half-angle 25 degrees -->
    <path d="M10.41 3.03 A5.7 5.7 0 1 1 5.59 3.03" stroke-width="1.3"/>
    <!-- y = 8.2 - 2.4 sin(2 pi (x - 2.3) / 5.7), x = 2.3..13.7 -->
    <path d="M2.3 8.2 C2.77 6.94 3.25 5.8 3.72 5.8 C4.2 5.8 4.67 6.94 5.15 8.2 C5.62 9.46 6.1 10.6 6.58 10.6 C7.05 10.6 7.53 9.46 8 8.2 C8.47 6.94 8.95 5.8 9.43 5.8 C9.9 5.8 10.38 6.94 10.85 8.2 C11.33 9.46 11.8 10.6 12.28 10.6 C12.75 10.6 13.22 9.46 13.7 8.2" stroke-width="1.2"/>
  </g>
  <circle cx="8" cy="2.5" r="1.2" fill="#3fd08e"/>
</svg>
