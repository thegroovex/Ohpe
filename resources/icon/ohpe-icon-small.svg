<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ohpe app icon - small master for 16, 24 and 32 px (32 grid). Own artwork (designed by groovex).
  Same mark as ohpe-icon.svg, redrawn for few pixels: the tile fills the square, thicker lines,
  a wider gap, a bigger red dot, one flat violet halo instead of the soft glow, no shadow.
  Rebuild all rasters, .icns and .ico: python3 tools/app-icon/make_icons.py
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0.5" x2="0" y2="31.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34302d"/>
      <stop offset="1" stop-color="#1b1918"/>
    </linearGradient>
    <!-- y = 16 - 4.4 sin(2 pi (x - 5.5) / 10.5), x = 5.5..26.5 -->
    <path id="wave" d="M5.5 16 C6.38 13.7 7.25 11.6 8.12 11.6 C9 11.6 9.88 13.7 10.75 16 C11.62 18.3 12.5 20.4 13.38 20.4 C14.25 20.4 15.12 18.3 16 16 C16.88 13.7 17.75 11.6 18.62 11.6 C19.5 11.6 20.38 13.7 21.25 16 C22.12 18.3 23 20.4 23.88 20.4 C24.75 20.4 25.62 18.3 26.5 16"/>
    <!-- ring r = 10.5 with the gap at the top (half-angle 22 degrees) -->
    <path id="ring" d="M19.93 6.26 A10.5 10.5 0 1 1 12.07 6.26"/>
  </defs>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="url(#tile)"/>
  <g fill="none" stroke-linecap="round">
    <use href="#ring" stroke="#8a74e8" stroke-opacity="0.45" stroke-width="4.4"/>
    <use href="#ring" stroke="#efe9de" stroke-width="2.4"/>
    <use href="#wave" stroke="#efe9de" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <circle cx="16" cy="5.3" r="1.9" fill="#e5243b"/>
</svg>
